repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.14
    hooks:
      - id: uv-lock
  - repo: https://github.com/narumiruna/ty-pre-commit
    rev: v0.0.37
    hooks:
      - id: ty-check
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v0.11.5
    hooks:
      - id: tombi-format
  - repo: local
    hooks:
      - id: sync-skills-check
        name: sync skills mirror
        entry: uv run python scripts/sync_skills.py --check
        language: system
        pass_filenames: false
        files: ^(skills/|\.codex/skills/|scripts/sync_skills\.py|\.pre-commit-config\.yaml$)
